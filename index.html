<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研英语大作文 · 短语拼装模板</title>
<style>
:root{
  --bg:#f2eee6; --ink:#20242a; --muted:#6b7280; --line:#ddd5c7;
  --card:#fffdf8; --accent:#b45309; --accent-soft:#fef3c7;
  --teal:#0f766e; --teal-soft:#ccfbf1; --dark:#1b2430; --dark2:#263241;
  --blue:#1d4ed8; --red:#b91c1c; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
noscript{display:block;padding:20px;background:#fee2e2;color:#7f1d1d}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,var(--dark),var(--dark2));color:#f8fafc;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px}
.bar1{border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#f59e0b,#b45309);font-weight:800;color:#1b2430;font-size:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.brand strong{display:block;font-size:15px;letter-spacing:.4px}
.brand small{display:block;color:#a8b3c2;font-size:11px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd5e1}
.field select{background:#0f1722;color:#f1f5f9;border:1px solid #38465a;border-radius:8px;padding:5px 8px;max-width:280px;outline:none}
.field select:focus{border-color:#f59e0b}
.btn{border:1px solid transparent;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;letter-spacing:.2px;transition:.15s}
.btn.ghost{background:rgba(255,255,255,.06);color:#e2e8f0;border-color:rgba(255,255,255,.14)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1b2430;box-shadow:0 2px 10px rgba(245,158,11,.3)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.seg{display:inline-flex;background:#0f1722;border:1px solid #38465a;border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:#cbd5e1;padding:6px 13px;font-size:12.5px;font-weight:600}
.seg button+button{border-left:1px solid #38465a}
.seg button.on{background:#f59e0b;color:#1b2430}
.toggles{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toggles label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#cbd5e1;cursor:pointer;user-select:none}
.toggles input{accent-color:#f59e0b;width:14px;height:14px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:18px;padding:18px;max-width:1680px;margin:0 auto}
@media (max-width:1280px){
  .layout{grid-template-columns:1fr}
  .previewPane{position:static}
  .preview{position:static;max-height:none}
  .bar1 .brand{flex:1 1 100%;margin-right:0}
  .bar1 .tools{width:100%}
}

/* ---------- editor ---------- */
.editor{min-width:0}
.paraCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 14px rgba(60,45,20,.05);margin-bottom:16px;overflow:hidden}
.paraHead{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(180deg,#fffdf8,#faf6ec);border-bottom:1px solid var(--line)}
.paraHead .pno{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.paraHead .ptitle{font-weight:800;letter-spacing:.3px}
.paraHead .pdesc{color:var(--muted);font-size:11.5px;margin-left:auto;text-align:right}

.sent{border-bottom:1px dashed #e7dfd1;padding:11px 16px 13px}
.sent:last-child{border-bottom:0}
.sentHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.sentLabel{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.4px;background:var(--accent-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.sentHint{font-size:11px;color:var(--muted)}
.selects{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.selWrap{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.selWrap select{background:#fff;border:1px solid #d9d0c0;border-radius:7px;padding:3px 6px;font-size:11.5px;color:#374151;max-width:330px;outline:none}
.selWrap select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(180,83,9,.12)}
.omitBtn{background:#fff;border:1px solid #d9d0c0;border-radius:7px;padding:2px 7px;font-size:11px;color:#6b7280}
.modeSel{background:#fff;border:1px solid #d9d0c0;border-radius:7px;padding:3px 7px;font-size:11.5px;color:#374151;outline:none;margin-left:8px}
.modeSel:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(180,83,9,.12)}
.omitBtn.on{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.sentText{font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;font-size:15px;line-height:1.9;color:#1f2937;word-break:break-word}
.sentAnnot{margin-top:6px;font-size:11.5px;color:#8a6d3b;background:#fffbeb;border-left:3px solid #f0c36d;padding:5px 9px;border-radius:0 6px 6px 0}
.sentOmitted{opacity:.42;filter:grayscale(.5)}
.sentOmitted .sentText{text-decoration:line-through;text-decoration-color:#b91c1c}

.slot{display:inline;padding:1px 5px;border-radius:4px;cursor:pointer;border-bottom:1.6px dashed var(--accent);background:var(--accent-soft);color:#8a4b06;transition:background .12s,color .12s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.slot.filled{background:var(--teal-soft);border-bottom-color:var(--teal);color:#0b5f59;font-weight:600}
.slot:hover{outline:2px solid rgba(180,83,9,.22);outline-offset:1px}
.slot:focus{outline:2px solid rgba(15,118,110,.45);outline-offset:1px}

.addCause{display:flex;gap:8px;justify-content:center;padding:10px}
.miniBtn{background:#fff;border:1px dashed #c9bda9;border-radius:8px;padding:4px 11px;font-size:12px;color:#7c6a4f}
.miniBtn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- preview ---------- */
.previewPane{min-width:0}
.previewHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 8px}
.previewHead strong{font-size:14px;letter-spacing:.3px}
.wc{font-size:11.5px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.wc.ok{color:var(--teal);font-weight:700}
.wc.over{color:var(--red);font-weight:700}
.hint{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.preview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(60,45,20,.08);padding:22px 26px 30px;font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;max-height:calc(100vh - 132px);overflow:auto;position:sticky;top:96px}
.prevPara{margin-bottom:18px}
.prevPara h3{font-size:11.5px;font-family:"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:1.4px;color:var(--accent);margin:0 0 7px;text-transform:uppercase;border-bottom:1px solid #ece3d3;padding-bottom:5px}
.prevSent{margin:0 0 9px;text-align:justify;line-height:1.95;font-size:15.5px}
.prevZh{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:12.5px;color:#8a8172;line-height:1.75;margin:-4px 0 9px;padding-left:10px;border-left:2px solid #ece3d3}
.prevZh.hide{display:none}
.prevEmpty{color:#a89f8e;font-style:italic;font-family:"Microsoft YaHei",sans-serif;font-size:13px;text-align:center;padding:30px 10px}
.prevTitle{font-family:"Segoe UI","Microsoft YaHei",sans-serif;text-align:center;font-size:12px;color:#8a8172;letter-spacing:2px;margin-bottom:14px}

/* ---------- panel ---------- */
.panel{position:fixed;z-index:120;width:min(380px,calc(100vw - 24px));max-height:72vh;overflow:auto;background:#fff;border:1px solid #e5ddcf;border-radius:14px;box-shadow:0 20px 60px rgba(30,25,15,.28);padding:14px 15px 15px}
.panel[hidden]{display:none}
.panelTop{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.panelTitle{font-weight:800;font-size:14px;flex:1}
.panelKey{font-size:10.5px;color:#a8a29e;font-family:ui-monospace,Consolas,monospace;background:#f5f5f4;padding:1px 5px;border-radius:4px}
.panelX{background:#f5f5f4;border:0;border-radius:7px;width:24px;height:24px;line-height:1;color:#78716c;font-size:16px}
.panelX:hover{background:#e7e5e4;color:#44403c}
.panelNote{font-size:11.5px;color:#8a8172;margin:2px 0 9px;line-height:1.55}
.panelInput{width:100%;border:1px solid #d9d0c0;border-radius:8px;padding:7px 9px;font-size:13px;background:#fffdf8;outline:none;margin-bottom:8px}
.panelInput:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(180,83,9,.12)}
.panelSearch{width:100%;border:1px solid #e5ddcf;border-radius:8px;padding:5px 8px;font-size:12px;background:#fafaf9;outline:none;margin-bottom:7px}
.panelSearch:focus{border-color:var(--accent)}
.optGroup{font-size:10.5px;font-weight:800;color:#a8a29e;letter-spacing:1px;margin:9px 0 3px;text-transform:uppercase}
.opt{display:block;width:100%;text-align:left;background:#fafaf9;border:1px solid #eee9e0;border-radius:8px;padding:6px 9px;margin:4px 0;transition:.12s}
.opt:hover{border-color:var(--accent);background:#fffbeb}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt b{font-weight:650;color:#1f2937;font-size:12.5px;display:block;word-break:break-word}
.opt span{color:#8a8172;font-size:11px;display:block;margin-top:1px;line-height:1.45}
.panelFoot{display:flex;gap:8px;margin-top:10px}
.panelFoot button{flex:1;border-radius:8px;padding:6px;font-size:12px;font-weight:600}
.panelFoot .clear{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.panelFoot .close{background:#f5f5f4;border:1px solid #e7e5e4;color:#57534e}
.emptyOpts{color:#a8a29e;font-size:12px;text-align:center;padding:12px 0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1b2430;color:#f8fafc;padding:9px 18px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .topbar,.editor,.panel,.toast,.previewHead .hint{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .preview{border:0;box-shadow:none;max-height:none;position:static;padding:0}
  .prevZh.hide{display:block}
}
/* ==========================================================
   清新简约主题（覆盖层）
   ========================================================== */
:root{
  --bg:#f4f8f6;
  --ink:#1f2b2f;
  --ink-2:#405156;
  --muted:#7d8d92;
  --line:#e4ece9;
  --line-2:#d6e3df;
  --card:#ffffff;
  --surface:#ffffff;
  --accent:#3f8f7e;
  --accent-2:#2f7566;
  --accent-soft:#e7f5f0;
  --accent-line:#bfe1d7;
  --warm:#c47a45;
  --warm-soft:#fff6ed;
  --warm-line:#efd1b6;
  --danger:#b4544c;
  --teal:#2f7566;
  --teal-soft:#e7f5f0;
  --dark:#1f2b2f;
  --dark2:#2b3a3f;
  --radius:16px;
}
body{
  background:
    radial-gradient(1200px 620px at 6% -12%, #e8f6ef 0%, rgba(232,246,239,0) 62%),
    radial-gradient(1100px 560px at 104% -4%, #edf4fb 0%, rgba(237,244,251,0) 58%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  letter-spacing:.01em;
}
::selection{background:var(--accent-soft);color:var(--accent-2)}

.topbar{
  color:var(--ink);
  background:rgba(255,255,255,.84);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(31,43,47,.02);
}
.topbar::before{
  content:"";display:block;height:3px;
  background:linear-gradient(90deg,#5aa892,#8ac7b6 38%,#b7d9ef 72%,#e8c9a7);
}
.bar{padding:9px 22px;gap:12px}
.bar1{border-bottom:1px solid var(--line)}
.bar2{padding-top:8px;padding-bottom:9px}
.brand{gap:11px}
.logo{
  width:35px;height:35px;border-radius:11px;
  background:linear-gradient(145deg,#eefaf5,#d8f0e8);
  border:1px solid var(--accent-line);
  color:var(--accent-2);font-weight:700;font-size:17px;
  box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(63,143,126,.08);
}
.brand strong{font-size:15px;font-weight:650;color:var(--ink);letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11px}
.tools{gap:8px}
.field{font-size:12px;color:var(--muted);gap:7px}
.field select{
  background:#fff;color:var(--ink);
  border:1px solid var(--line-2);border-radius:10px;
  padding:7px 10px;max-width:300px;
  box-shadow:0 1px 2px rgba(31,43,47,.03);
  transition:border-color .16s,box-shadow .16s;
}
.field select:hover{border-color:var(--accent-line)}
.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,143,126,.12)}
.btn{border-radius:10px;padding:7px 14px;font-size:12.5px;font-weight:600;letter-spacing:.15px;transition:.18s}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(31,43,47,.03)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#4c9d8a,#347d6c);color:#fff;border:1px solid rgba(47,117,102,.18);box-shadow:0 6px 16px rgba(63,143,126,.22)}
.btn.primary:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 8px 20px rgba(63,143,126,.26)}
.btn:disabled{opacity:.38;transform:none;box-shadow:none}

.seg{background:#edf3f1;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{color:var(--ink-2);padding:5px 14px;border-radius:9px;font-weight:600;font-size:12.5px}
.seg button+button{border-left:0}
.seg button.on{background:#fff;color:var(--accent-2);box-shadow:0 1px 4px rgba(31,43,47,.09)}
.toggles{gap:14px}
.toggles label{color:var(--ink-2);font-size:12px;font-weight:500}
.toggles input{accent-color:var(--accent)}

.layout{max-width:1640px;padding:22px;gap:22px}
.paraCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 10px rgba(31,43,47,.035);margin-bottom:18px;transition:box-shadow .2s,border-color .2s}
.paraCard:hover{box-shadow:0 8px 24px rgba(31,43,47,.055);border-color:#d9e6e1}
.paraHead{background:linear-gradient(180deg,#fff,#fbfdfc);border-bottom:1px solid var(--line);padding:13px 20px;gap:11px}
.pno{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-2);font-weight:700;font-size:12.5px}
.ptitle{font-weight:650;font-size:15px;letter-spacing:.2px}
.pdesc{color:var(--muted);font-size:11.5px}
.paraHead .pno,.paraHead .ptitle{flex:0 0 auto;white-space:nowrap}
.paraHead .pdesc{flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modeSel{background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:4px 8px;color:var(--ink-2);font-size:11.5px;margin-left:8px;flex:0 0 auto;max-width:200px;text-overflow:ellipsis}
#p2modeSel{max-width:132px}
#connStyleSel{max-width:196px}
#p3modeSel{max-width:174px}
.modeSel:hover{border-color:var(--accent-line)}
.modeSel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,143,126,.12)}

.sent{padding:14px 20px 15px;border-bottom:1px solid #f0f5f3}
.sent:last-child{border-bottom:0}
.sentHead{gap:8px;margin-bottom:8px}
.sentLabel{font-size:11px;font-weight:650;color:var(--accent-2);background:var(--accent-soft);border:1px solid var(--accent-line);padding:3px 9px;letter-spacing:.2px}
.sentHint{color:var(--muted)}
.selects{gap:6px}
.selWrap{font-size:11px;color:var(--muted);gap:4px}
.selWrap select{background:#fbfdfc;border:1px solid var(--line);border-radius:9px;padding:4px 8px;color:var(--ink-2);font-size:11.5px;transition:border-color .15s,box-shadow .15s}
.selWrap select:hover{border-color:var(--accent-line)}
.selWrap select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,143,126,.12)}
.omitBtn{background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:3px 8px;color:var(--muted);font-size:11px;transition:.15s}
.omitBtn:hover{border-color:var(--accent-line);color:var(--accent-2)}
.omitBtn.on{background:#fdf1ef;border-color:#f0d2cd;color:var(--danger)}
.sentText{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif SC","Songti SC",serif;font-size:15.5px;line-height:2;color:#223034;letter-spacing:.005em}
.sentAnnot{background:#f5faf8;border-left:3px solid var(--accent-line);color:#66787b;font-size:11.5px;padding:6px 10px;border-radius:0 8px 8px 0}
.sentOmitted{opacity:.45;filter:grayscale(.35)}

.slot{padding:1px 6px;border-radius:6px;border-bottom:1.5px dashed var(--warm);background:var(--warm-soft);color:#9a5a2b;transition:background .14s,color .14s,outline-color .14s}
.slot.filled{background:var(--accent-soft);border-bottom-color:var(--accent);color:#1f6f5e;font-weight:600}
.slot:hover{outline:2px solid rgba(63,143,126,.15);outline-offset:1px}
.slot:focus{outline:2px solid rgba(63,143,126,.4);outline-offset:2px}

.previewHead strong{font-size:14px;font-weight:650;letter-spacing:.2px}
.wc{color:var(--muted);font-size:11.5px}
.wc.ok{color:var(--accent-2)}
.wc.over{color:var(--warm)}
.hint{background:#fff;border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:999px;padding:2px 10px}
.preview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 34px rgba(31,43,47,.07);padding:26px 30px 34px;max-height:calc(100vh - 150px);top:120px}
.prevTitle{color:var(--muted);font-size:11.5px;letter-spacing:1.8px}
.prevPara h3{color:var(--accent-2);font-size:11px;letter-spacing:1.5px;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 9px;font-weight:650}
.prevSent{font-size:15.5px;line-height:2;color:#223034}
.prevZh{color:#7f908d;font-size:12.5px;line-height:1.8;border-left:2px solid var(--line-2);padding-left:11px;margin:-5px 0 11px}
.prevEmpty{color:#a3b1ae;font-size:12.5px}

.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 26px 70px rgba(31,43,47,.18);padding:16px}
.panelTitle{font-weight:650;font-size:14.5px}
.panelKey{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);font-size:10px}
.panelX{background:#f4f8f6;color:var(--muted);border-radius:8px}
.panelX:hover{background:#e9f2ef;color:var(--ink-2)}
.panelNote{color:#7f908d;font-size:11.5px}
.panelInput{background:#fbfdfc;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink)}
.panelInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,143,126,.12)}
.panelSearch{background:#fbfdfc;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--ink)}

function heuristicPlural(value){
  var t = String(value||'').trim().toLowerCase();
  if (!t) return false;
  if (/(^|\s)(we|they|people|children)(\s|$)/.test(t)) return true;
  var words = t.replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(Boolean);
  if (!words.length) return false;
  if (words[0]==='the'||words[0]==='a'||words[0]==='an') words = words.slice(1);
  if (words[0] && /ing$/.test(words[0])) return false;
  var prep = ['of','among','with','from','in','on','for','to','towards','about','across','over','under','by'];
  var idx = -1;
  for (var i=1;i<words.length;i++){ if (prep.indexOf(words[i])>=0){ idx=i; break; } }
  var head;
  if (idx>0) head = words[idx-1];
  else {
    if (words.indexOf('and')>=0){
      var last = words[words.length-1]||'';
      if (/(development|health|life|lives|stability|progress|growth|harmony|prosperity|confidence|security|quality|wellbeing|well-being|awareness|importance|significance|protection|education|communication|cooperation|teamwork|kindness|love|piety)$/.test(last)) return false;
      return true;
    }
    head = words[words.length-1]||'';
  }
  if (/[^s]s$/.test(head) && !/(ss|us|is)$/.test(head)) return true;
  return false;
}
function detectPlural(value, bank){
  var v = String(value||'').trim();
  if (!v) return false;
  if (Object.prototype.hasOwnProperty.call(PLURAL_MAP, v)) return PLURAL_MAP[v];
  if (bank && bank.options){
    for (var i=0;i<bank.options.length;i++){
      if (bank.options[i].v === v){
        if (bank.options[i].plural) return true;
        return heuristicPlural(v);
      }
    }
  }
  return heuristicPlural(v);
}

  var opts = (bank && bank.options) || [];
  for (var i=0;i<opts.length;i++){
    if (opts[i].v === value){

      return opts[i].sg || opts[i].v;

}

  var w = m[1];
  if (PROPER[w]) return true;
  if (/^[A-Z]{2,}/.test(w)) return true;
  if (/^[A-Z][a-z]+[A-Z]/.test(w)) return true;
  return false;
}
function setupAGREE(){

  AGREE['s3a'] = ['c3verb'];

/* ---------- 槽位读写 ---------- */
function getBank(key){
  if (BANKS[key]) return BANKS[key];
  return { key:key, label:key, free:true, hint:'', options:[] };
}
function getVal(scope, index, key){
  if (scope === 'global' || key === 'topic') return state.slots[key] || '';
  if (scope === 'cause'){
    var c = state.causes[index];
    return (c && c.values[key]) || state.slots[key] || '';
  }
  if (scope === 'measure'){
    var m = state.measures[index];
    return (m && m.values[key]) || state.slots[key] || '';
  }
  if (scope === 'debate'){
    return (state.debate.values && state.debate.values[key]) || state.slots[key] || '';
  }
  return state.slots[key] || '';
}
function setVal(scope, index, key, val){
  if (scope === 'global' || key === 'topic'){ state.slots[key] = val; return; }
  if (scope === 'cause'){ state.causes[index].values[key] = val; return; }
  if (scope === 'measure'){ state.measures[index].values[key] = val; return; }
  if (scope === 'debate'){ state.debate.values = state.debate.values || {}; state.debate.values[key] = val; return; }
}
function autoTopicZh(clearIfNotFound){
  var t = state.slots.topic || '';
  var opts = BANKS.topic.options;
  for (var i=0;i<opts.length;i++){
    if (opts[i].v === t){ state.slots.topicZh = opts[i].zh || t; return; }
  }
  if (clearIfNotFound) state.slots.topicZh = '';
}
function zhDisplay(key, raw, bank){
  if (key === 'topic' && state.slots.topicZh && raw === state.slots.topic) return state.slots.topicZh;
  var opts = (bank && bank.options) || [];
  for (var i=0;i<opts.length;i++) if (opts[i].v === raw) return opts[i].zh || raw;
  return raw;
}

/* ---------- 模板 → 片段（英文 / 中文） ---------- */
function variantSegments(v, ctx, lang){
  var isZh = lang === 'zh';
  var tpl = isZh ? (v.zh || v.en || '') : (v.en || '');
  var plural = ctx.g ? detectPlural(getVal(ctx.scope, ctx.index, ctx.g), getBank(ctx.g)) : false;
  var segs = [];
  var re = /\{([^{}]+)\}/g;
  var last = 0, m;
  while ((m = re.exec(tpl))){
    if (m.index > last) segs.push({ t:'text', v:tpl.slice(last, m.index) });
    var tok = m[1].trim();
    if (tok.charAt(0) === '#'){
      var name = tok.slice(1);
      var dv = isZh ? '' : (DERIVED[name] ? DERIVED[name](plural) : '');
      if (dv) segs.push({ t:'text', v:dv });
    } else {
      var raw = getVal(ctx.scope, ctx.index, tok);
      var bank = getBank(tok);
      var filled = !!(raw && String(raw).trim());
      var display;
      if (isZh){
        display = filled ? zhDisplay(tok, String(raw), bank) : '【'+bank.label+'】';
      } else {
        var val = filled ? String(raw) : '';
        if (filled && ctx.ag && ctx.ag.indexOf(tok) >= 0){
          val = agreePhrase(val, plural, bank);
        }
        display = filled ? val : '【'+bank.label+'】';
      }
      segs.push({ t:'slot', key:tok, label:bank.label, filled:filled, v:display, raw:raw||'', scope:ctx.scope, index:ctx.index });
    }
    last = re.lastIndex;
  }
  if (last < tpl.length) segs.push({ t:'text', v:tpl.slice(last) });
  return segs;
}
function modeFor(ch){
  if (ch === ',' || ch === ';') return 'low';
  if (ch === ':') return 'keep';
  if (ch === '.' || ch === '!' || ch === '?') return 'cap';
  return 'keep';
}
function modeForText(tv, ch){
  if (ch === ',' || ch === ';') return 'low';
  if (ch === ':') return 'keep';
  if (ch === '.' || ch === '!' || ch === '?') return 'cap';
  if (tv && /\b(while|whereas|and|but|or|with|among|from|to|of|on|about|towards|toward|across|over|under|by|at|into|within|without|upon|via|per|against|between|during|through|throughout|as|than|that|which|who|whose|because|although|though|if|when)\s*$/i.test(tv)) return 'low';
  return 'keep';
}
function cleanupSegs(segs){
  var out = [];
  for (var i=0;i<segs.length;i++){
    var s = segs[i];
    if (s.t === 'text'){
      if (out.length && out[out.length-1].t === 'text'){
        out[out.length-1].v += s.v;
        continue;
      }
      out.push({ t:'text', v:s.v });
    } else out.push(s);
  }
  for (var j=0;j<out.length;j++){
    if (out[j].t === 'text'){
      var v = out[j].v.replace(/ +/g,' ').replace(/\s+([,.;:!?])/g,'$1');
      if (j === 0) v = v.replace(/^ +/,'');
      if (j === out.length-1) v = v.replace(/ +$/,'');
      if (j>0 && out[j-1].t==='text' && / $/.test(out[j-1].v)) v = v.replace(/^ +/,'');
      out[j].v = v;
    } else {
      if (j+1<out.length && out[j+1].t==='text' && /^[,.;:!?]/.test(out[j+1].v)){
        out[j].v = String(out[j].v).replace(/ +$/,'');
      }
    }
  }
  out = out.filter(function(s){ return !(s.t==='text' && s.v===''); });
  if (out.length && out[0].t==='text') out[0].v = out[0].v.replace(/^ +/,'');
  if (out.length && out[out.length-1].t==='text') out[out.length-1].v = out[out.length-1].v.replace(/ +$/,'');
  return out;
}
function normalizeSegs(segs, lang){
  var isZh = lang === 'zh';
  var out = [];
  var mode = 'cap';
  var prevChar = '';
  for (var i=0;i<segs.length;i++){
    var s = segs[i];
    if (!s) continue;
    if (s.t === 'join'){
      out.push({ t:'text', v:s.sep });
      prevChar = s.sep.indexOf('.') >= 0 ? '.' : ((s.sep.trim().slice(-1)) || prevChar);
      mode = s.mode || 'cap';
      continue;
    }
    if (s.t === 'text'){
      var v = String(s.v==null?'':s.v).replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1');
      if (!v) continue;
      if (!isZh){
        var idx = v.search(/[A-Za-z]/);
        if (idx >= 0){
          if (mode === 'cap') v = v.slice(0,idx)+v.charAt(idx).toUpperCase()+v.slice(idx+1);
          else if (mode === 'low' && !isProperWord(v.slice(idx))) v = v.slice(0,idx)+v.charAt(idx).toLowerCase()+v.slice(idx+1);
        }
      }
      out.push({ t:'text', v:v });
      var tv = v.replace(/\s+$/,'');
      if (tv) prevChar = tv.charAt(tv.length-1);
      mode = modeForText(tv, prevChar);
      continue;
    }
    var sv = String(s.v==null?'':s.v);
    if (!isZh){
      var si = sv.search(/[A-Za-z]/);
      if (si >= 0){
        if (mode === 'cap') sv = sv.slice(0,si)+sv.charAt(si).toUpperCase()+sv.slice(si+1);
        else if (mode === 'low' && !isProperWord(sv.slice(si))) sv = sv.slice(0,si)+sv.charAt(si).toLowerCase()+sv.slice(si+1);
      }
    }
    var ns = {};
    for (var k in s) if (Object.prototype.hasOwnProperty.call(s,k)) ns[k] = s[k];
    ns.v = sv;
    out.push(ns);
    var st = sv.replace(/\s+$/,'');
    if (st) prevChar = st.charAt(st.length-1);
    mode = modeFor(prevChar);
  }
  return cleanupSegs(out);
}
function plainOf(segs){
  return segs.map(function(s){ return s.t==='text' ? s.v : (s.v||''); }).join('').replace(/ +/g,' ').trim();
}

/* ---------- 段落结构 ---------- */
function partVariant(part){
  if (part.fixed) return findById(part.list, part.fixed) || part.list[0];
  return findById(part.list, state.variants[part.sel]) || part.list[0];
}
function renderGroup(group, lang){
  var scope = group.scope || 'global';
  var index = group.index || 0;
  var segs = [];
  var prevJoinMode = null;
  var prevVariant = null;
  group.parts.forEach(function(part, i){
    var v = partVariant(part);
    var pctx = { scope:scope, index:index, g:v.g, ag:AGREE[v.id] || [] };
    var ps = variantSegments(v, pctx, lang);
    if (i > 0){
      var prev = plainOf(segs);
      var sep = ' ';
      var mode = 'cap';
      if (group.join === 'sentence'){
        sep = (/[.!?]$/.test(prev)) ? ' ' : '. ';
        mode = 'cap';
      } else if (group.join === 'clause'){
        var last = prev ? prev.charAt(prev.length-1) : '';
        if (prevJoinMode) mode = prevJoinMode;
        else if (last === ':') mode = 'keep';
        else if (last === ',') mode = 'low';
        else if (/that\s*$/.test(prev)) mode = 'low';
        else mode = 'cap';
      }
      segs.push({ t:'join', sep:sep, mode:mode });
    }
    segs = segs.concat(ps);
    prevJoinMode = v.joinMode || null;
    prevVariant = v;
  });
  return normalizeSegs(segs, lang);
}
function getGroups(){

function unitSegs(unit, lang){
  if (unit.kind === 'group') return renderGroup(unit.group, lang);
  if (unit.kind === 'cause'){
    var c = state.causes[unit.index];
    var sch = findScheme(c.scheme);
    var v = findById(sch.variants, c.variant) || sch.variants[0];
    var csegs = variantSegments(v, { scope:'cause', index:unit.index, g:v.g, ag:AGREE[v.id] || [] }, lang);
    var conn = connectorFor(unit.index, lang);
    if (conn) csegs.unshift({ t:'text', v:conn + ' ' });
    return normalizeSegs(csegs, lang);
  }
  if (unit.kind === 'measure'){
    var m = state.measures[unit.index];
    var vv = findById(MEASURE_VARIANTS, m.id) || MEASURE_VARIANTS[0];
    return normalizeSegs(variantSegments(vv, { scope:'measure', index:unit.index, g:vv.g, ag:AGREE[vv.id] || [] }, lang), lang);
  }
  return [];
}
function isOmitted(group){
  if (group.leanOptional && state.toggles.lean && state.omit[group.id] !== false) return true;

function segsPlain(segs){
  return segs.map(function(s){ return s.t==='text' ? s.v : (s.t==='slot' ? s.v : ''); }).join('').replace(/ +/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim();

    html += '<div class="sent"><div class="sentHead"><span class="sentLabel">措施 '+(i+1)+'</span><div class="selects">'+sel+'</div></div>'+body+annot+'</div>';

  return html;
}
function debateEditorHtml(){

/* ---------- 状态保障 ---------- */
function ensureVariant(key, list){
  if (!findById(list, state.variants[key])) state.variants[key] = list[0].id;
}
function ensureState(){
  if (!state || typeof state !== 'object') state = defaultState();
  if (!SUBTYPES[state.type]) state.type = 'chart';
  var subs = SUBTYPES[state.type];
  if (!subs.some(function(s){ return s.id === state.subtype; })) state.subtype = subs[0].id;
  state.slots = state.slots || {};
  state.variants = state.variants || {};
  state.toggles = Object.assign({ bilingual:false, lean:false, annot:false }, state.toggles || {});
  state.omit = state.omit || {};
  state.debate = Object.assign({ transition:'d1', formula:'df1', values:{} }, state.debate || {});
  state.debate.values = state.debate.values || {};
  state.causeCount = state.causeCount === 2 ? 2 : 3;
  if (!CONNECTOR_STYLES.some(function(s){ return s.id === state.connectorStyle; })) state.connectorStyle = 'none';
  state.exam = state.exam === 'en2' ? 'en2' : 'en1';
  state.p2mode = state.p2mode === 'debate' ? 'debate' : 'normal';
  state.p3mode = state.p3mode === 'forecast' ? 'forecast' : 'measure';
  state.preset = state.preset || '';

  getGroups().forEach(function(g){
    g.parts.forEach(function(part){
      if (!findById(part.list, state.variants[part.sel])) state.variants[part.sel] = part.list[0].id;
    });
  });
  ensureVariant('p2t', P2_TRANSITIONS);
  ensureVariant('p3sum', SUMMARY);
  ensureVariant('p3vision', VISIONS);
  ensureVariant('p3forecast', FORECASTS);

  var cdef = [['sch3','s3a'],['sch1','s1a'],['sch5','s5a']];
  if (!Array.isArray(state.causes)) state.causes = [];
  for (var i=0;i<3;i++){
    if (!state.causes[i] || typeof state.causes[i] !== 'object'){
      state.causes[i] = { scheme:cdef[i][0], variant:cdef[i][1], values:{} };
    }
    var c = state.causes[i];
    c.values = c.values || {};
    if (!CAUSE_SCHEMES.some(function(s){ return s.id === c.scheme; })) c.scheme = 'sch3';
    var sch = findScheme(c.scheme);
    if (!findById(sch.variants, c.variant)) c.variant = sch.variants[0].id;
  }
  state.causes = state.causes.slice(0,3);

  if (!Array.isArray(state.measures)) state.measures = [];
  var mdef = ['gov','media'];
  for (var j=0;j<2;j++){
    if (!state.measures[j] || typeof state.measures[j] !== 'object'){
      state.measures[j] = { id:mdef[j], values:{} };
    }
    var m = state.measures[j];
    m.values = m.values || {};
    if (!findById(MEASURE_VARIANTS, m.id)) m.id = MEASURE_VARIANTS[0].id;
  }
  state.measures = state.measures.slice(0,2);

  if (!findById(DEBATE_TRANSITIONS, state.debate.transition)) state.debate.transition = DEBATE_TRANSITIONS[0].id;
  if (!findById(DEBATE_FORMULAS, state.debate.formula)) state.debate.formula = DEBATE_FORMULAS[0].id;
}

/* ---------- 持久化 / 撤销 ---------- */
var save = debounce(function(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}, 260);
function loadSaved(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      var s = JSON.parse(raw);
      if (s && s.type) return s;
    }
  } catch(e){}
  return null;
}
function updateUndoCount(){
  var el = $('#undoCount');
  if (el) el.textContent = String(undoStack.length);
  var btn = $('#undoBtn');
  if (btn) btn.disabled = undoStack.length === 0;
}
function pushSnapshot(){
  try {
    undoStack.push(clone(state));
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoCount();
  } catch(e){}
}
function undo(){
  if (!undoStack.length){ toast('没有可撤销的操作'); return; }
  state = undoStack.pop();
  ensureState();
  syncControls();
  renderEditor();
  renderPreview();
  updateUndoCount();
  save();
  toast('已撤销');
}

/* ---------- 类型 / 预设 / 清空 ---------- */
function switchType(type){
  if (!SUBTYPES[type] || state.type === type) return;
  pushSnapshot();
  state.type = type;
  state.subtype = SUBTYPES[type][0].id;
  state.variants = {};
  state.causes = [];
  state.measures = [];
  state.omit = {};
  state.preset = '';
  ensureState();
  syncControls();
  renderEditor();
  renderPreview();
  save();
}
function switchSubtype(sub){
  if (!SUBTYPES[state.type].some(function(s){ return s.id === sub; })) return;
  pushSnapshot();
  state.subtype = sub;
  state.variants = {};
  state.preset = '';
  ensureState();
  syncControls();
  renderEditor();
  renderPreview();
  save();
}
function clearAll(){
  pushSnapshot();
  state.slots = {};
  state.variants = {};
  state.causes = [];
  state.measures = [];
  state.omit = {};
  state.preset = '';
  ensureState();
  syncControls();
  renderEditor();
  renderPreview();
  save();
  toast('已清空（可撤销）');
}
function loadPresetById(id){
  if (!id) return;
  var p = null;
  for (var i=0;i<PRESETS.length;i++) if (PRESETS[i].id === id) p = PRESETS[i];
  if (!p) return;
  pushSnapshot();
  var toggles = clone(state.toggles);
  state = defaultState();
  state.type = p.type;
  state.subtype = p.subtype;
  state.slots = clone(p.slots || {});
  state.variants = clone(p.variants || {});
  state.causes = clone(p.causes || []);
  state.measures = clone(p.measures || []);
  state.p2mode = p.p2mode || 'normal';
  state.p3mode = p.p3mode || 'measure';
  state.causeCount = p.causeCount || 3;
  state.debate = clone(p.debate || { transition:'d1', formula:'df1', values:{} });
  state.exam = p.exam || 'en1';
  state.preset = p.id;
  state.toggles = toggles;
  autoTopicZh(false);
  ensureState();
  syncControls();
  renderEditor();
  renderPreview();
  save();
  toast('已载入：' + p.name);
}
function toggleOmit(id){
  pushSnapshot();
  var leanOpt = false;
  getGroups().forEach(function(g){ if (g.id === id && g.leanOptional) leanOpt = true; });
  if (state.toggles.lean && leanOpt){
    state.omit[id] = (state.omit[id] === false) ? true : false;
  } else {
    state.omit[id] = !state.omit[id];
  }
  renderEditor();
  renderPreview();
  save();
}

/* ---------- 槽位面板 ---------- */
function openPanel(el){
  var key = el.getAttribute('data-key');
  var scope = el.getAttribute('data-scope') || 'global';
  var index = parseInt(el.getAttribute('data-index'), 10);
  if (isNaN(index)) index = 0;
  var rect = null;
  try { rect = el.getBoundingClientRect(); } catch(e){}
  panelState = { key:key, scope:scope, index:index, bank:getBank(key), rect:rect };
  panelDirty = false;
  renderPanel();
  var p = $('#panel');
  if (p) p.hidden = false;
  positionPanel(rect);
  var input = $('#panelInput');
  if (input && panelState.bank.free){ try { input.focus(); input.select(); } catch(e){} }
}
function renderPanel(){
  if (!panelState) return;
  var bank = panelState.bank;
  var cur = String(getVal(panelState.scope, panelState.index, panelState.key) || '');
  var isTopic = panelState.key === 'topic';
  var html = '<div class="panelTop"><div class="panelTitle">'+esc(bank.label)+'</div>'+
    '<span class="panelKey">'+esc(panelState.key)+'</span>'+
    '<button type="button" class="panelX" data-act="close" aria-label="关闭">×</button></div>';
  html += '<div class="panelNote">'+esc(bank.hint || '点选下方短语，或直接手动输入。')+'</div>';
  if (bank.free){
    html += '<input class="panelInput" id="panelInput" type="text" value="'+esc(cur)+'" placeholder="输入英文短语…">';
  }
  if (isTopic){
    html += '<input class="panelInput" id="panelZhInput" type="text" value="'+esc(state.slots.topicZh||'')+'" placeholder="中文主题（用于中英对照，可留空）">';
  }
  if (bank.options.length > 7){
    html += '<input class="panelSearch" id="panelSearch" type="text" placeholder="搜索短语 / 中文注释…">';
  }
  html += '<div id="panelOpts">';
  if (!bank.options.length){
    html += '<div class="emptyOpts">该槽位暂无预设短语，直接手输即可。</div>';
  } else {
    var cats = [], map = {};
    bank.options.forEach(function(o){
      var c = o.cat || '';
      if (!map[c]){ map[c] = []; cats.push(c); }
      map[c].push(o);
    });
    cats.forEach(function(c){
      if (c) html += '<div class="optGroup">'+esc(c)+'</div>';
      map[c].forEach(function(o){
        var note = [o.zh, o.note].filter(Boolean).join(' · ');
        html += '<button type="button" class="opt'+(o.v===cur?' sel':'')+'" data-act="pick" data-value="'+esc(o.v)+'"><b>'+esc(o.v)+'</b><span>'+esc(note||'通用')+'</span></button>';
      });
    });
  }
  html += '</div>';
  html += '<div class="panelFoot"><button type="button" class="clear" data-act="clear">清空本槽</button><button type="button" class="close" data-act="close">关闭</button></div>';
  var p = $('#panel');
  if (p) p.innerHTML = html;
}
function positionPanel(rect){
  var p = $('#panel');
  if (!p) return;
  var vw = window.innerWidth || document.documentElement.clientWidth || 1024;
  var vh = window.innerHeight || document.documentElement.clientHeight || 768;
  var w = Math.min(380, vw - 24);
  var hasRect = rect && (rect.width || rect.height || rect.top || rect.left);
  var left = hasRect ? rect.left : 24;
  var top = hasRect ? rect.bottom + 8 : 140;
  if (left + w > vw - 12) left = vw - w - 12;
  if (left < 12) left = 12;
  var maxTop = Math.max(12, vh - Math.min(520, vh * 0.72) - 16);
  if (top > maxTop) top = Math.max(12, (rect && rect.top ? rect.top - 430 : 60));
  if (top < 12) top = 12;
  p.style.left = left + 'px';
  p.style.top = top + 'px';
}
function closePanel(){
  panelState = null;
  panelDirty = false;
  var p = $('#panel');
  if (p){ p.hidden = true; p.innerHTML = ''; }
}
function pickOption(btn){
  if (!panelState) return;
  if (!panelDirty){ pushSnapshot(); panelDirty = true; }
  var val = btn.getAttribute('data-value') || '';
  setVal(panelState.scope, panelState.index, panelState.key, val);
  if (panelState.key === 'topic'){
    autoTopicZh(false);
    var zhInp = $('#panelZhInput');
    if (zhInp) zhInp.value = state.slots.topicZh || '';
  }
  var inp = $('#panelInput');
  if (inp) inp.value = val;
  $$('#panel .opt').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-value') === val); });
  renderEditor();
  renderPreview();
  save();
}
function clearSlot(){
  if (!panelState) return;
  if (!panelDirty){ pushSnapshot(); panelDirty = true; }
  setVal(panelState.scope, panelState.index, panelState.key, '');
  if (panelState.key === 'topic') state.slots.topicZh = '';
  var inp = $('#panelInput');
  if (inp) inp.value = '';
  var zhInp = $('#panelZhInput');
  if (zhInp) zhInp.value = '';
  $$('#panel .opt').forEach(function(b){ b.classList.remove('sel'); });

  renderPreview();
  save();
}

/* ---------- 复制 ---------- */
function buildCopyText(){
  var paras = [
    getGroups().map(function(g){ return { kind:'group', group:g }; }),
    p2Units(),
    p3Units()
  ];
  return paras.map(function(units){
    return units.filter(function(u){ return !unitOmitted(u); }).map(function(u){
      var en = segsPlain(unitSegs(u,'en'));
      if (!en) return '';
      if (state.toggles.bilingual){
        var zh = segsPlain(unitSegs(u,'zh'));
        return en + '\n' + zh;
      }
      return en;
    }).filter(Boolean).join(' ');
  }).filter(Boolean).join('\n\n');
}
function fallbackCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand && document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    toast(ok ? '已复制全文' : '复制失败，请手动选择预览区文字');
  } catch(e){ toast('复制失败，请手动选择预览区文字'); }
}
function copyAll(){
  var text = buildCopyText();
  if (!text){ toast('还没有可复制的内容'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('已复制全文'); }, function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}

/* ---------- 事件 ---------- */
function bindEvents(){
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    var typeBtn = t.closest('#typeSeg button');
    if (typeBtn){ switchType(typeBtn.getAttribute('data-type')); return; }
    if (t.closest('#undoBtn')){ undo(); return; }
    if (t.closest('#clearBtn')){ clearAll(); return; }
    if (t.closest('#copyBtn')){ copyAll(); return; }
    var omit = t.closest('.omitBtn');
    if (omit){ toggleOmit(omit.getAttribute('data-omit')); return; }
    var slot = t.closest('.slot');
    if (slot){ e.preventDefault(); openPanel(slot); return; }
    var act = t.closest('[data-act]');
    if (act){
      var a = act.getAttribute('data-act');
      if (a === 'close') closePanel();
      else if (a === 'clear') clearSlot();
      else if (a === 'pick') pickOption(act);
      return;
    }
    if (panelState && !t.closest('#panel')) closePanel();
  });

  document.addEventListener('change', function(e){
    var el = e.target;
    if (!el) return;
    if (el.id === 'subtypeSel'){ if (el.value && el.value !== state.subtype) switchSubtype(el.value); return; }
    if (el.id === 'presetSel'){ if (el.value) loadPresetById(el.value); return; }
    if (el.id === 'examSel'){ pushSnapshot(); state.exam = el.value === 'en2' ? 'en2' : 'en1'; renderPreview(); save(); return; }
    if (el.id === 'causeSel'){ pushSnapshot(); state.causeCount = el.value === '2' ? 2 : 3; renderEditor(); renderPreview(); save(); return; }
    if (el.id === 'connStyleSel'){ pushSnapshot(); state.connectorStyle = el.value; ensureState(); renderEditor(); renderPreview(); save(); return; }
    if (el.id === 'p2modeSel'){ pushSnapshot(); state.p2mode = el.value === 'debate' ? 'debate' : 'normal'; ensureState(); renderEditor(); renderPreview(); save(); return; }
    if (el.id === 'p3modeSel'){ pushSnapshot(); state.p3mode = el.value === 'forecast' ? 'forecast' : 'measure'; ensureState(); renderEditor(); renderPreview(); save(); return; }
    if (el.id === 'tgBilingual'){ pushSnapshot(); state.toggles.bilingual = !!el.checked; renderPreview(); save(); return; }
    if (el.id === 'tgLean'){ pushSnapshot(); state.toggles.lean = !!el.checked; renderEditor(); renderPreview(); save(); return; }
    if (el.id === 'tgAnnot'){ pushSnapshot(); state.toggles.annot = !!el.checked; renderEditor(); renderPreview(); save(); return; }
    if (el.classList.contains('sentenceSel')){
      pushSnapshot();
      state.variants[el.getAttribute('data-sel')] = el.value;
      renderEditor(); renderPreview(); save(); return;
    }
    if (el.classList.contains('causeSchemeSel')){
      pushSnapshot();
      var ci = parseInt(el.getAttribute('data-cause'), 10) || 0;
      var sch = findScheme(el.value);
      state.causes[ci].scheme = sch.id;
      state.causes[ci].variant = sch.variants[0].id;
      renderEditor(); renderPreview(); save(); return;
    }
    if (el.classList.contains('causeVariantSel')){
      pushSnapshot();
      var cvi = parseInt(el.getAttribute('data-cause-variant'), 10) || 0;
      state.causes[cvi].variant = el.value;
      renderEditor(); renderPreview(); save(); return;
    }
    if (el.classList.contains('measureSel')){
      pushSnapshot();
      var mi = parseInt(el.getAttribute('data-measure'), 10) || 0;
      state.measures[mi].id = el.value;
      renderEditor(); renderPreview(); save(); return;
    }
    if (el.classList.contains('debateSel')){
      pushSnapshot();
      state.debate[el.getAttribute('data-debate')] = el.value;
      ensureState();
      renderEditor(); renderPreview(); save(); return;
    }
  });

  var inputTimer = null;
  document.addEventListener('input', function(e){
    var el = e.target;
    if (!el) return;
    if (el.id === 'panelSearch'){
      var q = String(el.value||'').toLowerCase();
      $$('#panel .opt').forEach(function(btn){
        btn.style.display = (!q || btn.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
      });
      return;
    }
    if (el.id === 'panelZhInput'){
      if (!panelDirty){ pushSnapshot(); panelDirty = true; }
      state.slots.topicZh = el.value;
      renderPreview(); save(); return;
    }
    if (el.id === 'panelInput'){
      if (!panelState) return;
      if (!panelDirty){ pushSnapshot(); panelDirty = true; }
      setVal(panelState.scope, panelState.index, panelState.key, el.value);
      if (panelState.key === 'topic') autoTopicZh(true);
      $$('#panel .opt').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-value') === el.value); });
      clearTimeout(inputTimer);
      inputTimer = setTimeout(function(){
        renderEditor();
        renderPreview();
      }, 120);
      save();
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && panelState){ closePanel(); return; }
    if (e.key === 'Enter' && e.target && (e.target.id === 'panelInput' || e.target.id === 'panelZhInput')){
      closePanel();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){
      var tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag !== 'input' && tag !== 'textarea'){ e.preventDefault(); undo(); }
    }
  });

  window.addEventListener('beforeunload', function(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} });
}

/* ---------- 调试 / 统计 ---------- */
function computeStats(){
  var options = 0, bankCount = 0;
  Object.keys(BANKS).forEach(function(k){ bankCount++; options += (BANKS[k].options || []).length; });
  var templates = 0;
  function add(l){ templates += (l || []).length; }
  ['dynSingle','dynMulti','static','dual','universal'].forEach(function(s){ add(CHART_C1[s]); add(CHART_C2[s]); });
  add(TRANSITIONS); add(PHENOMENA); add(P2_TRANSITIONS);
  CAUSE_SCHEMES.forEach(function(s){ add(s.variants); });
  add(SUMMARY); add(MEASURE_VARIANTS); add(VISIONS); add(FORECASTS);
  add(PIC_LEADS); add(PIC_FORMULAS); add(THEME_LEADS); add(THEME_IDEAS);
  add(TEXT_LEADS); add(TEXT_VIEWS); add(TEXT_ATTITUDES);
  add(DEBATE_TRANSITIONS); add(DEBATE_FORMULAS);
  return {
    types: 3,
    subtypes: Object.keys(SUBTYPES).reduce(function(n,k){ return n + SUBTYPES[k].length; }, 0),
    presets: PRESETS.length,
    banks: bankCount,
    options: options,
    templates: templates,
    causeSchemes: CAUSE_SCHEMES.length,
    measureVariants: MEASURE_VARIANTS.length,
    causeTemplates: CAUSE_SCHEMES.reduce(function(n,s){ return n + s.variants.length; }, 0)
  };
}
function exposeDebug(){
  window.__essayApp = {
    getState: function(){ return state; },
    setState: function(s){ state = s; ensureState(); syncControls(); renderEditor(); renderPreview(); },
    renderAll: function(){ ensureState(); syncControls(); renderEditor(); renderPreview(); },
    openSlot: function(el){ openPanel(el); },
    closePanel: closePanel,
    loadPreset: loadPresetById,
    presets: PRESETS,
    subtypes: SUBTYPES,
    banks: BANKS,
    data: {
      CHART_C1:CHART_C1, CHART_C2:CHART_C2, CAUSE_SCHEMES:CAUSE_SCHEMES, MEASURE_VARIANTS:MEASURE_VARIANTS,
      SUMMARY:SUMMARY, VISIONS:VISIONS, FORECASTS:FORECASTS, P2_TRANSITIONS:P2_TRANSITIONS,
      TRANSITIONS:TRANSITIONS, PHENOMENA:PHENOMENA, PIC_LEADS:PIC_LEADS, PIC_FORMULAS:PIC_FORMULAS,
      THEME_LEADS:THEME_LEADS, THEME_IDEAS:THEME_IDEAS, TEXT_LEADS:TEXT_LEADS, TEXT_VIEWS:TEXT_VIEWS,
      TEXT_ATTITUDES:TEXT_ATTITUDES, DEBATE_TRANSITIONS:DEBATE_TRANSITIONS, DEBATE_FORMULAS:DEBATE_FORMULAS
    },
    stats: computeStats()
  };
}

/* ---------- 预设补全 ---------- */
function normalizePresets(){
  PRESETS.forEach(function(p){
    p.slots = p.slots || {};
    var vi = p.variants || {};
    var idea = vi.themeIdea;
    if (idea === 'ti1' || idea === 'ti2' || idea === 'ti2b'){
      if (!p.slots.themeAdj) p.slots.themeAdj = 'indispensable';
      if (!p.slots.themeProblem) p.slots.themeProblem = 'subject';
    }
    if (idea === 'ti2' || idea === 'ti2b' || idea === 'ti3' || idea === 'ti4b'){
      if (!p.slots.themeAgent) p.slots.themeAgent = 'us';
    }
    if (vi.p3vision === 'vis1'){
      if (!p.slots.vA) p.slots.vA = "children's physical exercise";
      if (!p.slots.vB) p.slots.vB = 'intellectual development';
    }
    if (vi.c2 === 'staticf1' || vi.c2 === 'staticf1s'){
      if (!p.slots.occupyVerb) p.slots.occupyVerb = 'account for';
      if (!p.slots.rankVerb) p.slots.rankVerb = 'tops the list';
    }
    if (vi.p3sum === 'sum4' && !p.slots.s4state){
      p.slots.s4state = 'an integral part of our lives';
    }
  });
}

/* ---------- 启动 ---------- */
function init(){
  setupAGREE();
  normalizePresets();
  buildPresetSelect();
  state = loadSaved() || defaultState();
  ensureState();
  syncControls();
  bindEvents();
  renderEditor();
  renderPreview();
  updateUndoCount();
  exposeDebug();
}
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
